services:
  - type: web
    name: salto-estelar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: salto-estelar-db
          property: connectionString

databases:
  - name: salto-estelar-db
    databaseName: salto_estelar
    user: salto_estelar
    plan: free
